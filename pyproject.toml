[project]
name = "telco-churn-api"
version = "0.1.0"
description = "End-to-end churn prediction: sklearn/XGBoost model served via FastAPI"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # errors, pyflakes, import sorting, warnings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
